<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Images de référence</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  /* Titre de série */
  .bloc-titre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .bloc-titre .script { font-size: 190px; transform: rotate(-5deg) translate(-360px, 6px); filter: url(#craie); }
  .bloc-titre .titre { font-size: 208px; filter: url(#craie); }
  .bloc-titre .label { margin-top: 44px; font-size: 34px; letter-spacing: 0.24em; color: var(--craie); opacity: .85; }
  .bloc-titre .label i { font-style: normal; color: var(--orange); padding: 0 14px; }

  /* Bandeau haut des scènes de terrain */
  .bandeau { position: absolute; top: 24px; left: 160px; right: 160px; height: 70px; display: flex; align-items: center; justify-content: space-between; }
  .bandeau .gauche { display: flex; align-items: center; gap: 22px; }
  .bandeau .titre { font-size: 62px; }
  .bandeau .droite { display: flex; align-items: baseline; gap: 18px; }
  .bandeau .droite .script { font-size: 50px; }
  .bandeau .droite .label { font-size: 24px; color: var(--craie-grise); }
  .sous-titre.bas { top: 948px; }

  /* Carte réflexe */
  .reflexe-titre { position: absolute; top: 120px; left: 0; right: 0; text-align: center; }
  .reflexe-titre .script { font-size: 150px; filter: url(#craie); display: inline-block; transform: rotate(-4deg); }
  .cartes { position: absolute; top: 430px; align-items: stretch; left: 190px; right: 190px; display: flex; gap: 70px; }
  .carte { flex: 1; position: relative; background: var(--ardoise-claire); border-radius: 14px; padding: 92px 54px 66px;  box-shadow: 0 0 0 3px rgba(242,239,233,.55); }
  .carte .onglet { position: absolute; top: -34px; left: 44px; background: var(--orange); color: var(--ardoise); font-family: var(--titre); font-size: 50px; padding: 8px 30px 12px; border-radius: 8px; transform: skewX(-10deg); }
  .carte .quand { font-family: var(--label); font-weight: 700; font-size: 34px; letter-spacing: .12em; text-transform: uppercase; color: var(--ciel); margin-bottom: 22px; }
  .carte .quoi { font-family: var(--label); font-weight: 700; font-size: 74px; line-height: 1.08; color: var(--craie); }
  .carte .quoi b { color: var(--orange); }
  .coin { position: absolute; top: 34px; left: 160px; display: flex; align-items: center; gap: 20px; }
  .coin .titre { font-size: 46px; }
</style>
</head>
<body>
<div class="cadre-video" id="cadre"></div>
<script src="../kit.js"></script>
<script>
const frame = (location.hash || '#titre').slice(1);
const cadre = document.getElementById('cadre');
const svg = (classe, contenu) => `<svg class="${classe}" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">${contenu}</svg>`;

function titre() {
  const g = [
    // Haut
    `<g filter="url(#craie)"><path d="M380,62 H1310" stroke="${C.craie}" stroke-width="7" stroke-dasharray="46 22" stroke-linecap="round" opacity=".75"/></g>`,
    rond(30, 20, 78, C.orange, 9), croix(150, 150, 38, C.craie, 8, 6, .85), fleche(250, 20, 215, 190, 318, 262, C.craie, 7, .8, 26),
    rond(1450, 82, 56, C.orange, 7), croix(1452, 84, 30, C.craie, 7, 0, .8), croix(1558, 92, 28, C.craie, 7, 4, .8), croix(1662, 96, 28, C.craie, 7, -5, .8),
    croix(1838, 124, 60, C.orange, 16, 4), rond(1530, 258, 40, C.craie, 6, .75),
    // Côtés
    hachures(8, 470, 13, 46, 48, C.orange, 9, true), fleche(1838, 250, 1912, 400, 1800, 462, C.craie, 7, .7, 26, '34 22'),
    // Bas
    rond(180, 968, 62, C.orange, 8), croix(126, 880, 42, C.craie, 8, -8, .85), fleche(380, 1070, 362, 950, 420, 876, C.craie, 8, .75, 26), fleche(500, 1075, 492, 1010, 520, 958, C.craie, 7, .6, 22),
    rond(1160, 962, 48, C.craie, 6, .7), croix(1232, 920, 30, C.craie, 6, 10, .7),
    hachures(1360, 1010, 7, 44, 60, C.orange, 9, false), rond(1850, 800, 30, C.craie, 6, .75), rond(1790, 872, 28, C.craie, 6, .75), rond(1862, 884, 30, C.craie, 6, .75), rond(1720, 950, 32, C.craie, 6, .75), rond(1846, 968, 30, C.craie, 6, .75),
  ].join('');
  return svg('fond', defs() + fond() + g) + `
    <div class="bloc-titre">
      <div class="script">Lire la</div>
      <div class="titre">COUVERTURE</div>
      <div class="label">Quarterback et receveurs <i>✕</i> 5 couvertures <i>○</i> 7 vidéos</div>
    </div>`;
}

function sceneTerrain(theme) {
  const f = terrain({ theme });
  const clair = theme === 'clair';
  const marge = [croix(70, 300, 26, C.craie, 6, 8, .35), rond(78, 520, 28, C.craie, 5, .3), croix(1852, 420, 24, C.craie, 6, -6, .3), rond(1846, 640, 26, C.orange, 6, .5), hachures(34, 700, 5, 34, 36, C.orange, 7, true, .7)].join('');

  const zones = [
    f.zone(9, 17, 8.3, 2.6, '1/3 PROFOND'), f.zone(26.667, 17, 8.3, 2.6, '1/3 PROFOND'), f.zone(44.3, 17, 8.3, 2.6, '1/3 PROFOND'),
    f.zone(11.6, 7, 6.3, 1.5, 'CURL / FLAT', 'courte'), f.zone(21.7, 7, 3.7, 1.4, 'HOOK', 'courte'), f.zone(31.7, 7, 3.7, 1.4, 'HOOK', 'courte'), f.zone(41.8, 7, 6.3, 1.5, '', 'courte'),
  ].join('');

  const bleuMvt = { col: f.t.bleu, w: 5, tirets: '4 12', tete: 14 };
  const attaque = [
    ...[-3.4, -1.7, 1.7, 3.4].map((d) => f.attaquant(26.667 + d, -0.6, '', 16)), f.centre(26.667, -0.6),
    f.attaquant(26.667, -5, 'QB'), f.attaquant(29.5, -5, 'RB'),
    f.attaquant(5.8, 0, 'X'), f.attaquant(14, -1, 'H'), f.attaquant(39.3, -1, 'Y'), f.attaquant(47.5, 0, 'Z'),
  ].join('');
  const defense = [
    ...[22.6, 25.3, 28, 30.7].map((x) => f.ligneDef(x, 1.1)),
    f.trace([[4.2, 8.4], [4.2, 12.6]], bleuMvt), f.defenseur(4.2, 13.8, 'CB'),
    f.trace([[49.2, 8.4], [49.2, 12.6]], bleuMvt), f.defenseur(49.2, 13.8, 'CB'),
    f.defenseur(15, 5.2, 'N'), f.defenseur(22.3, 5.2, 'LB'), f.defenseur(31.2, 5.2, 'LB'), f.defenseur(26.667, 13.4, 'FS'),
    f.trace([[40.4, 5.7], [42.7, 4.9]], bleuMvt), f.halo(44, 4.4), f.defenseur(44, 4.4, 'SS'),
  ].join('');

  const X = f.X, Y = f.Y;
  const vol = `<path d="M${X(26.667)},${Y(-4.2)} Q${X(33)},${Y(9)} ${X(45.9)},${Y(10.5)}" fill="none" stroke="${C.orange}" stroke-width="4" stroke-dasharray="3 13" stroke-linecap="round"/>`;
  const traces = [f.trace([[39.3, -0.2], [40.2, 1.9], [48.6, 2.9]], { op: .45 }), f.trace([[47.5, 0.8], [47.5, 12], [46.6, 10.4]])].join('');

  // Règle de lecture, en bas à gauche du terrain
  const regle = `<g transform="translate(${X(1.4)} ${Y(-2.5)})" font-family="Barlow Condensed" font-weight="700" font-size="27" letter-spacing="2.2">
      <rect width="330" height="46" rx="7" fill="${C.orange}"/><text x="18" y="33" fill="${C.ardoise}">IL S'ÉLARGIT  →  CURL</text>
      <rect y="56" width="330" height="46" rx="7" fill="none" stroke="${clair ? '#b9bdbf' : 'rgba(242,239,233,.4)'}" stroke-width="2.5"/><text x="18" y="89" fill="${clair ? '#9ea2a4' : 'rgba(242,239,233,.5)'}">IL RESTE  →  FLAT</text>
    </g>`;

  const scene = f.base + zones + f.cone(26.667, -5, 44, 4.4) + traces + vol + attaque + defense + f.ballon(40.9, 9.35, -14) + f.etiquette(42.4, 7, 'DÉFENSEUR EN CONFLIT') + regle;

  return svg('fond', defs() + fond() + marge) + svg('scene', scene) + `
    <div class="bandeau">
      <div class="gauche"><span class="titre">COVER 3</span><span class="pastille pleine">Zone</span><span class="pastille">1 safety</span></div>
      <div class="droite"><span class="script">La battre</span><span class="label">Lecture du QB</span></div>
    </div>
    <div class="sous-titre bas">Il s'élargit vers le flat : <b>tu lances le curl.</b></div>`;
}

function reflexe() {
  const g = [croix(120, 250, 34, C.craie, 7, 8, .5), rond(1790, 210, 44, C.orange, 7, .9), croix(1792, 212, 24, C.craie, 6, 0, .6), hachures(10, 520, 9, 44, 44, C.orange, 8, true, .8),
    fleche(1500, 980, 1640, 1040, 1780, 960, C.craie, 6, .5, 22, '30 18'), rond(250, 990, 30, C.craie, 6, .5), croix(330, 960, 24, C.craie, 6, 6, .5)].join('');
  return svg('fond', defs() + fond() + g) + `
    <div class="coin"><span class="titre">COVER 3</span><span class="pastille pleine">Zone</span><span class="pastille">1 safety</span></div>
    <div class="reflexe-titre"><span class="script">Le réflexe</span></div>
    <div class="cartes">
      <div class="carte"><div class="onglet">QB</div><div class="quand">1 safety, les corners reculent</div><div class="quoi">Je lis le <b>défenseur du&nbsp;flat.</b></div></div>
      <div class="carte"><div class="onglet">WR</div><div class="quand">Je pousse le corner, puis</div><div class="quoi">Je m'arrête <b>devant&nbsp;lui</b>, ou j'attaque <b>la&nbsp;seam.</b></div></div>
    </div>`;
}

cadre.innerHTML = { titre, 'terrain-clair': () => sceneTerrain('clair'), 'terrain-ardoise': () => sceneTerrain('ardoise'), reflexe }[frame]();
</script>
</body>
</html>
