<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Images de référence</title>
<link rel="stylesheet" href="../../videos/assets/tokens.css">
<style>
  /* Titre de série, sur ardoise */
  .bloc-titre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .bloc-titre .script { font-size: 190px; transform: rotate(-5deg) translate(-360px, 6px); filter: url(#craie); }
  .bloc-titre .titre { font-size: 208px; filter: url(#craie); }
  .bloc-titre .label { margin-top: 44px; font-size: 34px; letter-spacing: 0.24em; color: var(--craie); opacity: .85; }
  .bloc-titre .label i { font-style: normal; color: var(--orange); padding: 0 14px; }

  /* Habillage des scènes de terrain : marges hors-jeu à gauche et à droite */
  .ombre { filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .55)); }
  .ui-g { position: absolute; left: 26px; top: 30px; width: 276px; }
  .ui-g .titre { font-size: 56px; }
  .pastilles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .etape { margin-top: 40px; }
  .etape .script { font-size: 50px; display: block; }
  .etape .label { font-size: 19px; color: rgba(255, 255, 255, .7); display: block; margin-top: 8px; }
  .regle { position: absolute; left: 26px; top: 640px; width: 276px; display: flex; flex-direction: column; gap: 10px; }
  .regle div { font-family: var(--label); font-weight: 700; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; padding: 9px 14px 10px; border-radius: 8px; }
  .regle .oui { background: var(--orange); color: var(--ardoise); }
  .regle .non { border: 2px solid rgba(255, 255, 255, .4); color: rgba(255, 255, 255, .55); }
  .compte { position: absolute; left: 26px; top: 640px; width: 276px; font-family: var(--label); font-weight: 700; color: #fff; }
  .compte div { display: flex; align-items: baseline; gap: 12px; font-size: 24px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
  .compte b { font-family: var(--titre); font-weight: 400; font-size: 64px; letter-spacing: 0; }
  .compte .p b { color: var(--ciel); } .compte .c b { color: var(--jaune); }
  .rappel { margin-top: 18px; background: var(--jaune); color: var(--ardoise); border-radius: 8px; padding: 9px 14px 10px; font-size: 21px; letter-spacing: .06em; text-transform: uppercase; line-height: 1.15; }
  .ui-d { position: absolute; right: 26px; top: 40px; width: 268px; }
  .etapes { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 3px solid rgba(255, 255, 255, .25); }
  .etapes li { font-family: var(--label); font-weight: 700; font-size: 20px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .45); padding: 7px 0; position: relative; }
  .etapes li.ici { color: var(--orange); }
  .etapes li.ici::before { content: ""; position: absolute; left: -27px; top: 12px; width: 15px; height: 15px; border-radius: 50%; background: var(--orange); }
  .etapes li.fait { color: rgba(255, 255, 255, .8); }
  .legende { position: absolute; right: 26px; bottom: 44px; width: 268px; font-family: var(--label); font-weight: 600; font-size: 19px; letter-spacing: .06em; text-transform: uppercase; color: rgba(255, 255, 255, .8); }
  .legende div { display: flex; align-items: center; gap: 12px; margin-top: 9px; }
  .legende svg { flex: none; }

  /* Plan serré : panneau flottant */
  .panneau { position: absolute; left: 30px; top: 30px; background: rgba(14, 18, 15, .82); border-radius: 14px; padding: 18px 26px 22px; }
  .panneau .titre { font-size: 50px; }
  .panneau .pastilles { margin-top: 12px; }
  .panneau .etape { margin-top: 14px; display: flex; align-items: baseline; gap: 14px; }
  .panneau .etape .script { font-size: 40px; display: inline; }
  .panneau .etape .label { display: inline; margin: 0; }
  .regle.serre { top: 252px; left: 30px; width: 344px; }
  .regle.serre div { font-size: 26px; }
  .regle.serre .non { background: rgba(14, 18, 15, .78); }

  /* Carte réflexe, sur ardoise */
  .reflexe-titre { position: absolute; top: 120px; left: 0; right: 0; text-align: center; }
  .reflexe-titre .script { font-size: 150px; filter: url(#craie); display: inline-block; transform: rotate(-4deg); }
  .cartes { position: absolute; top: 430px; left: 190px; right: 190px; display: flex; gap: 70px; align-items: stretch; }
  .carte { flex: 1; position: relative; background: var(--ardoise-claire); border-radius: 14px; padding: 92px 54px 66px; box-shadow: 0 0 0 3px rgba(242, 239, 233, .55); }
  .carte .onglet { position: absolute; top: -34px; left: 44px; background: var(--orange); color: var(--ardoise); font-family: var(--titre); font-size: 50px; padding: 8px 30px 12px; border-radius: 8px; transform: skewX(-10deg); }
  .carte .quand { font-family: var(--label); font-weight: 700; font-size: 34px; letter-spacing: .12em; text-transform: uppercase; color: var(--ciel); margin-bottom: 22px; }
  .carte .quoi { font-family: var(--label); font-weight: 700; font-size: 74px; line-height: 1.08; color: var(--craie); }
  .carte .quoi b { color: var(--orange); }
  .coin { position: absolute; top: 34px; left: 160px; display: flex; align-items: center; gap: 20px; }
  .coin .titre { font-size: 46px; }
</style>
</head>
<body>
<div class="cadre-video" id="cadre"></div>
<script src="../../videos/assets/kit.js"></script>
<script>
const frame = (location.hash || '#titre').slice(1);
const cadre = document.getElementById('cadre');
const svg = (classe, contenu) => `<svg class="${classe}" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">${contenu}</svg>`;
const PASTILLES = `<div class="pastilles"><span class="pastille zone">Zone</span><span class="pastille">1 safety</span><span class="pastille">MOFC</span></div>`;

function titre() {
  const g = [
    `<g filter="url(#craie)"><path d="M380,62 H1310" stroke="${C.craie}" stroke-width="7" stroke-dasharray="46 22" stroke-linecap="round" opacity=".75"/></g>`,
    rond(30, 20, 78, C.orange, 9), croix(150, 150, 38, C.craie, 8, 6, .85), fleche(250, 20, 215, 190, 318, 262, C.craie, 7, .8, 26),
    rond(1450, 82, 56, C.orange, 7), croix(1452, 84, 30, C.craie, 7, 0, .8), croix(1558, 92, 28, C.craie, 7, 4, .8), croix(1662, 96, 28, C.craie, 7, -5, .8),
    croix(1838, 124, 60, C.orange, 16, 4), rond(1530, 258, 40, C.craie, 6, .75),
    hachures(8, 470, 13, 46, 48, C.orange, 9, true), fleche(1838, 250, 1912, 400, 1800, 462, C.craie, 7, .7, 26, '34 22'),
    rond(180, 968, 62, C.orange, 8), croix(126, 880, 42, C.craie, 8, -8, .85), fleche(380, 1070, 362, 950, 420, 876, C.craie, 8, .75, 26), fleche(500, 1075, 492, 1010, 520, 958, C.craie, 7, .6, 22),
    rond(1160, 962, 48, C.craie, 6, .7), croix(1232, 920, 30, C.craie, 6, 10, .7),
    hachures(1360, 1010, 7, 44, 60, C.orange, 9, false), rond(1850, 800, 30, C.craie, 6, .75), rond(1790, 872, 28, C.craie, 6, .75), rond(1862, 884, 30, C.craie, 6, .75), rond(1720, 950, 32, C.craie, 6, .75), rond(1846, 968, 30, C.craie, 6, .75),
  ].join('');
  return svg('fond', defs() + fond() + g) + `
    <div class="bloc-titre">
      <div class="script">Lire la</div>
      <div class="titre">COUVERTURE</div>
      <div class="label">Quarterback et receveurs <i>✕</i> 5 couvertures <i>○</i> 8 vidéos</div>
    </div>`;
}

// Formation de base 2x2 : c'est aussi l'état neutre, première et dernière image de chaque vidéo.
const attaque = (f) => [
  ...[-3.2, -1.6, 1.6, 3.2].map((d) => f.ligneOff(26.667 + d, -0.8)), f.centre(26.667, -0.8),
  f.attaquant(26.667, -5, 'QB'), f.attaquant(29.7, -5, 'RB'),
  f.attaquant(5.8, -0.8, 'X'), f.attaquant(14, -1.9, 'H'), f.attaquant(39.3, -1.9, 'Y'), f.attaquant(47.5, -0.8, 'Z'),
].join('');
const ligneDef = (f) => [22.4, 25.2, 28.1, 30.9].map((x) => f.ligneDef(x, 0.95)).join('');
const zonesC3 = (f, sansDroite = false) => [
  f.zone(9, 18, 8.3, 3.4, '1/3 PROFOND'), f.zone(26.667, 18, 8.3, 3.4, '1/3 PROFOND'), f.zone(44.3, 18, 8.3, 3.4, '1/3 PROFOND'),
  f.zone(11.6, 7, 6.3, 1.6, 'CURL / FLAT', 'courte'), f.zone(21.7, 7, 3.7, 1.5, 'HOOK', 'courte'), f.zone(31.7, 7, 3.7, 1.5, 'HOOK', 'courte'), f.zone(41.8, 7, 6.3, 1.6, sansDroite ? '' : 'CURL / FLAT', 'courte'),
].join('');

const LEGENDE = `<div class="legende ombre">
  <div><svg width="34" height="24"><circle cx="17" cy="12" r="10" fill="#fff"/></svg>Attaque</div>
  <div><svg width="34" height="24"><circle cx="17" cy="12" r="9.5" fill="#1d1e20" stroke="#fff" stroke-width="2"/></svg>Défense</div>
  <div><svg width="34" height="24"><circle cx="17" cy="12" r="6" fill="#ffc400"/><circle cx="17" cy="12" r="10" fill="none" stroke="#ffc400" stroke-width="2.5"/></svg>Défenseur lu</div>
  <div><svg width="34" height="24"><path d="M2,12 H30 M22,5 L30,12 L22,19" fill="none" stroke="#ff8a1f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>Il continue de courir</div>
  <div><svg width="34" height="24"><path d="M2,12 H30 M30,4 V20" fill="none" stroke="#ff8a1f" stroke-width="4" stroke-linecap="round"/></svg>Il s'arrête</div>
</div>`;
const etapes = (n) => `<div class="ui-d ombre"><ul class="etapes">${["Carte d'identité", 'La reconnaître', 'Ses faiblesses', 'La battre', 'Ne pas confondre', 'Réflexe'].map((e, i) => `<li class="${i === n ? 'ici' : i < n ? 'fait' : ''}">${e}</li>`).join('')}</ul></div>`;

function neutre() {
  const f = terrain();
  return svg('fond', defs() + f.base + attaque(f) + f.vignette);
}

function identite() {
  const f = terrain();
  const defense = [f.defenseur(4.4, 7.6, 'CB'), f.defenseur(49, 7.6, 'CB'), f.defenseur(26.667, 13.2, 'FS'), f.defenseur(41.2, 5, 'SS'), f.defenseur(15, 5, 'N'), f.defenseur(22.3, 4.8, 'LB'), f.defenseur(31.2, 4.8, 'LB')].join('');
  const mofc = f.cadenas(26.667, 23.6) + f.etiquette(26.667, 22.4, 'MOFC · MILIEU FERMÉ', { col: '#fff', coulTexte: C.vertTexte });
  return svg('fond', defs() + f.base + zonesC3(f) + mofc + attaque(f) + ligneDef(f) + defense + f.vignette) + `
    <div class="ui-g ombre"><span class="titre">COVER 3</span>${PASTILLES}
      <div class="etape"><span class="script">Carte d'identité</span></div></div>
    <div class="compte ombre"><div class="p"><b>3</b> profonds</div><div class="c"><b>4</b> dessous</div>
      <div class="rappel label">Zone = je m'assieds dans le trou</div></div>
    ${etapes(0)}${LEGENDE}
    <div class="sous-titre"><span>Trois défenseurs se partagent la profondeur, <b>un tiers chacun.</b></span></div>`;
}

function lecture(serre) {
  const f = serre ? terrain({ ppy: 42, ox: 1800 - 53.333 * 42, oy: 700 }) : terrain();
  const k = f.ppy / 24, mvt = { col: '#fff', w: 3 * k, tirets: `${3 * k} ${9 * k}`, op: .85 };
  const defense = [
    f.trace([[4.4, 8], [4.4, 13.4]], mvt), f.defenseur(4.4, 15, 'CB'),
    f.trace([[49, 8], [49, 13.4]], mvt), f.defenseur(49, 15, 'CB'),
    f.defenseur(15, 5.2, 'N'), f.defenseur(22.3, 5.2, 'LB'), f.defenseur(31.2, 5.2, 'LB'), f.defenseur(26.667, 14.6, 'FS'),
    f.trace([[40.2, 5.8], [42.4, 5]], mvt), f.defenseur(44, 4.4, 'SS', { conflit: true }),
  ].join('');
  const traces = f.trace([[39.3, -1.1], [40.4, 1.7], [48.8, 2.7]], { op: .55 }) + f.trace([[47.5, 0], [47.5, 12.6], [46.1, 10.4]], { fin: 'stop' });
  const scene = f.base + zonesC3(f, true) + f.cone(26.667, -5, 44, 4.4) + traces + f.vol(26.667, -4.2, 33, 9, 45.4, 10.5)
    + attaque(f) + ligneDef(f) + defense + f.ballon(40.9, 9.4, -14) + f.etiquette(42.2, 7.1, 'DÉFENSEUR EN CONFLIT') + f.vignette;
  const regle = `<div class="regle ${serre ? 'serre' : ''} ombre"><div class="oui">Il s'élargit → curl</div><div class="non">Il reste → flat</div></div>`;
  const ui = serre
    ? `<div class="panneau"><span class="titre">COVER 3</span>${PASTILLES}<div class="etape"><span class="script">La battre</span><span class="label">Lecture du QB</span></div></div>${regle}`
    : `<div class="ui-g ombre"><span class="titre">COVER 3</span>${PASTILLES}<div class="etape"><span class="script">La battre</span><span class="label">Lecture du QB</span></div></div>${regle}${etapes(3)}${LEGENDE}`;
  return svg('fond', defs() + scene) + ui + `<div class="sous-titre"><span>Il s'élargit vers le flat : <b>tu lances le curl.</b></span></div>`;
}

function reflexe() {
  const g = [croix(120, 250, 34, C.craie, 7, 8, .5), rond(1790, 210, 44, C.orange, 7, .9), croix(1792, 212, 24, C.craie, 6, 0, .6), hachures(10, 520, 9, 44, 44, C.orange, 8, true, .8),
    fleche(1500, 980, 1640, 1040, 1780, 960, C.craie, 6, .5, 22, '30 18'), rond(250, 990, 30, C.craie, 6, .5), croix(330, 960, 24, C.craie, 6, 6, .5)].join('');
  return svg('fond', defs() + fond() + g) + `
    <div class="coin"><span class="titre">COVER 3</span><span class="pastille zone">Zone</span><span class="pastille">1 safety</span><span class="pastille">MOFC</span></div>
    <div class="reflexe-titre"><span class="script">Le réflexe</span></div>
    <div class="cartes">
      <div class="carte"><div class="onglet">QB</div><div class="quand">1 safety, les corners reculent</div><div class="quoi">Je lis le <b>défenseur du&nbsp;flat.</b></div></div>
      <div class="carte"><div class="onglet">WR</div><div class="quand">Je pousse le corner, puis</div><div class="quoi">Je m'arrête <b>devant&nbsp;lui</b>, ou j'attaque <b>la&nbsp;seam.</b></div></div>
    </div>`;
}

cadre.innerHTML = { titre, neutre, identite, 'lecture-large': () => lecture(false), 'lecture-serre': () => lecture(true), reflexe }[frame]();
</script>
</body>
</html>
