<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>03 · Cover 1</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/scene.css">
<script src="assets/gsap.min.js"></script>
<script src="assets/kit.js"></script>
<script src="assets/scene.js"></script>
<script src="assets/audio/03-cover-1.timing.js"></script>
</head>
<body>
<div id="root" data-composition-id="cover-1" data-start="0" data-duration="100" data-width="1920" data-height="1080">
  <div id="scene" class="clip" data-start="0" data-duration="100" data-track-index="0"></div>
  <audio id="voix" src="assets/audio/03-cover-1.mp3" data-start="0" data-duration="100" data-track-index="1" data-volume="1"></audio>
</div>
<script>
// Minutage de la voix : T = début d'une phrase, F = sa fin, A = un instant à l'intérieur (0 = début, 1 = fin).
const M = window.MINUTAGE, P = {};
M.scenes.forEach((s) => s.phrases.forEach((p) => { P[p.id] = p; }));
const T = (id) => P[id].t0, F = (id) => P[id].t1, A = (id, r) => P[id].t0 + r * (P[id].t1 - P[id].t0);

const hote = document.getElementById('scene');
const S = creerScene(hote);
const tl = gsap.timeline({ paused: true });
const { X, Y } = S;

// --- Cover 1 : man partout, un safety au milieu, un joueur libre au milieu court (R, le robber) ---
const DEF1 = { CBG: [6.6, 1.6], CBD: [46.7, 1.6], N: [14.8, 1.8], SS: [38.5, 2], LB: [31, 5.2], R: [25.5, 6.8], FS: [26.667, 13.5] };
const LIENS = [['X', 'CBG'], ['H', 'N'], ['Y', 'SS'], ['Z', 'CBD'], ['RB', 'LB']];
const MAN = ['CBG', 'CBD', 'N', 'SS', 'LB'];

// --- Éléments du terrain ---
const att = S.creerAttaque(true);
const def = S.creerDefense(DEF1, false);
S.zone('z-aide', 26.667, 14.6, 8, 3.1, 'AIDE PROFONDE');
S.zone('z-rob', 25.5, 6.8, 4.4, 1.6, '', 'courte');
S.teinte('couloir', 3.4, 0.4, 6.6, 22, C.orange, 0.16);
LIENS.forEach(([a, d]) => S.ligne('ln-' + a, S.ATTAQUE[a][0], S.ATTAQUE[a][1], DEF1[d][0], DEF1[d][1], { col: '#fff', w: 3, tirets: '3 8' }));
S.ligne('l-10', 0, 10, 53.333, 10, { col: C.jaune, w: 4, tirets: '14 10' });
S.ligne('d-g', 26.667, 13.5, 5.8, 13.5, { col: '#fff', w: 3, tirets: '4 9' }); S.ligne('d-d', 26.667, 13.5, 47.5, 13.5, { col: '#fff', w: 3, tirets: '4 9' });
S.ligne('l-regard', 46.7, 1.6, 47.5, -0.8, { col: C.jaune, w: 4, tirets: '' });
S.ligne('l-rob', 25.5, 2.4, 25.5, 9.4, { col: C.jaune, w: 4, tirets: '10 8' });
S.trace('t-out', [[47.5, -0.1], [47.5, 10], [51.8, 10.6]]);
S.trace('t-cb', [[47.5, -0.1], [47.5, 12.6], [50.4, 10.6]], { fin: 'stop', op: 0.6 });
S.trace('t-x3', [[14, -1.3], [16, 3], [42, 3.2]]);
S.trace('t-fade', [[5.8, -0.1], [4.9, 6], [4.7, 20.5]]);
S.trace('t-derive', [[5.8, -0.1], [8, 8], [14, 19]], { col: C.rouge, op: 0.85 });
S.trace('t-m1', [[14, -1.3], [17, 4.6], [40, 5.2]]); S.trace('t-m2', [[39.3, -1.3], [36.3, 5.6], [13.5, 5]]);
S.trace('t-zv', [[47.5, -0.1], [47.5, 11]]);
const E = (id, x, y, texte, o) => S.etiquette(id, x, y, texte, o);
const BLANC = { col: '#fff', coulTexte: C.vertTexte, taille: 22 }, ROUGE = { col: C.rouge, coulTexte: '#fff', taille: 19 }, ORANGE = { col: C.orange, taille: 19 };
E('e-1s', 26.667, 16, '1 SAFETY', { taille: 34 });
E('e-ferme', 26.667, 19.2, 'MILIEU FERMÉ', { col: '#fff', coulTexte: C.vertTexte, taille: 26 });
S.cadenas('cad', 26.667, 21.6, true);
E('e-rob', 25.5, 9.2, 'ROBBER', { taille: 19 });
E('e-12', 34.6, 13.5, '12 À 15 YARDS', { taille: 17 });
E('e-colle', 43, 2.9, 'COLLÉ', { taille: 13 }); E('e-int', 43, 1.5, "À L'INTÉRIEUR", { taille: 13 });
E('e-ind', 26.667, 21.6, 'UN INDICE, PAS UNE PREUVE', BLANC);
E('e-20g', 15, 14.6, '20 YARDS', { taille: 16 }); E('e-20d', 38.5, 14.6, '20 YARDS', { taille: 16 });
E('e-regle', 26.667, 21.6, 'LOIN DU SAFETY · APRÈS LE ROBBER', BLANC);
E('e-out', 49.4, 12.4, 'OUT', ORANGE); E('e-cb', 44.2, 12.6, 'COMEBACK', ORANGE);
E('e-largeur', 10.6, 21.4, 'GARDE TA LARGEUR', ORANGE);
E('e-meme', 26.667, 21.6, 'MÊME IMAGE AVANT LE SNAP', BLANC);
E('e-c1', 37, 12.5, 'COVER 1 · MAN', { col: C.bleu, coulTexte: '#fff', taille: 15 }); E('e-c3', 37, 12.5, 'COVER 3 · ZONE', { taille: 15 });
E('e-dist', 26.667, 21.6, "NE TE FIE PAS QU'À SA DISTANCE", BLANC);
S.numero('no1g', 5.8, 11, 1); S.numero('no1d', 47.5, 11, 1); S.numero('no2', 50.4, 13, 2); S.numero('no3', 27, 1.7, 3);
S.marque('m-derive', 14, 19);
S.ballon();

// --- Habillage du chapitre ---
S.habillage({
  titre: 'COVER 1',
  pastilles: [['man', 'Man'], ['', '1 safety'], ['', 'Milieu fermé']],
  etapes: [["Carte d'identité", ''], ['La reconnaître', 'Avant le snap'], ['La reconnaître', 'Au snap'], ['Ses faiblesses', ''],
    ['La battre', 'Côté quarterback'], ['La battre', 'Le duel extérieur'], ['La battre', 'Le mesh'], ['Ne pas confondre', ''], ['Réflexe', '']],
});
const gribouillis = [
  rond(30, 20, 78, C.orange, 9), rond(1450, 82, 56, C.orange, 7), croix(1452, 84, 30, C.craie, 7, 0, .8), croix(1558, 92, 28, C.craie, 7, 4, .8), croix(1662, 96, 28, C.craie, 7, -5, .8),
  croix(1838, 124, 60, C.orange, 16, 4), hachures(8, 470, 13, 46, 48, C.orange, 9, true), rond(150, 990, 50, C.orange, 8), croix(96, 920, 34, C.craie, 8, -8, .85),
  hachures(1420, 1016, 7, 44, 56, C.orange, 9, false), rond(1850, 800, 30, C.craie, 6, .75), rond(1790, 872, 28, C.craie, 6, .75), rond(1862, 884, 30, C.craie, 6, .75),
].join('');
hote.insertAdjacentHTML('beforeend', `
  <div class="bloc-g ombre" id="bloc-rappel" style="opacity:0"><div class="rappel">Man = je cours, je ne m'arrête pas</div></div>
  <div class="bloc-g ombre" id="bloc-un" style="opacity:0"><div class="ligne"><b>1</b>safety</div></div>
  <div class="bloc-g ombre" id="bloc-regle" style="opacity:0"><div class="regle"><div>Je lance <b>loin du safety</b></div><div>Croisement : <b>après le robber</b></div></div></div>
  <div class="ardoise" id="ardoise" style="opacity:0">
    <svg width="1920" height="1080" viewBox="0 0 1920 1080">${defs()}${fond()}<g data-layout-allow-overflow>${gribouillis}</g></svg>
    <div class="coin" style="position:absolute;top:34px;left:160px;display:flex;align-items:center;gap:20px"><span class="titre" style="font-size:46px">COVER 1</span><span class="pastille man">Man</span><span class="pastille">1 safety</span></div>
    <div class="titre-ardoise"><span class="script">Le réflexe</span></div>
    <div class="cartes">
      <div class="carte" id="rx-qb" style="opacity:0"><div class="onglet">QB</div><div class="quand">Un safety et du man</div><div class="quoi">Je lance <b>loin du safety</b>, après <b>le&nbsp;robber.</b></div></div>
      <div class="carte" id="rx-wr" style="opacity:0"><div class="onglet">WR</div><div class="quand">Man</div><div class="quoi">Je gagne <b>mon duel.</b></div><div class="quoi" id="rx-cours" style="opacity:0">Je cours, je sépare, <b>je ne m'arrête&nbsp;pas.</b></div></div>
    </div>
  </div>`);
creerSousTitres(hote, tl, M);

// --- Aides propres à cette vidéo ---
const liens = (actif, t) => LIENS.forEach(([a]) => (actif ? S.montre(tl, 'ln-' + a, t, 0.25, 0.9) : S.cache(tl, 'ln-' + a, t, 0.2)));
const poseLiens = (t) => LIENS.forEach(([a, d]) => S.poseLigne(tl, 'ln-' + a, S.ATTAQUE[a][0], S.ATTAQUE[a][1], DEF1[d][0], DEF1[d][1], t));
const bloc = (id, t) => ['bloc-rappel', 'bloc-un', 'bloc-regle'].forEach((b) => tl.to('#' + b, { opacity: b === id ? 1 : 0, duration: 0.25 }, t));
const haloEteint = (id, t, col = C.jaune) => { tl.to(`#${id} .halo1`, { opacity: 0, duration: 0.2 }, t); tl.set(`#${id} .halo1`, { stroke: col }, t + 0.25); };
const cache = (ids, t, d = 0.25) => ids.forEach((id) => S.cache(tl, id, t, d));
const remet = (t, d = 0.45) => { S.formation(tl, S.ATTAQUE, t, d); S.formation(tl, DEF1, t, d); poseLiens(t + d + 0.02); };
const marges = (actif, t) => ['ui-d', 'legende'].forEach((id) => (actif ? S.montre(tl, id, t, 0.25) : S.cache(tl, id, t, 0.25)));
const ZOOM_CB = { zoom: 2.2, cx: 44, cy: 3, sx: 1150, sy: 470 }, ZOOM_SNAP = { zoom: 1.8, cx: 44, cy: 5, sx: 1180, sy: 440 };
// Un joueur court son tracé, son défenseur le poursuit, et le pointillé de marquage les suit tous les deux.
const duel = (rec, pts, d, defn, ptsDef, t, retard = 0.06, dDef = d + 0.08) => {
  S.court(tl, rec, pts, t, d); S.court(tl, defn, ptsDef, t + retard, dDef);
  S.boutCourt(tl, 'ln-' + rec, 1, pts, t, d); S.boutCourt(tl, 'ln-' + rec, 2, ptsDef, t + retard, dDef);
};
const OUT_Z = [[47.5, -0.8], [47.5, 10], [51.8, 10.6]], OUT_CB = [[46.7, 1.6], [46.8, 10.6], [49.6, 12]];
const M1 = [[14, -1.9], [17, 4.6], [40, 5.2]], M2 = [[39.3, -1.9], [36.3, 5.6], [13.5, 5]];
const M1D = [[14.8, 1.8], [16.4, 3.2], [35.6, 3.8]], M2D = [[38.5, 2], [37.2, 4.1], [18.4, 3.6]];
const mesh = (t, d = 2.4) => {
  S.dessine(tl, 't-m1', t, d); S.dessine(tl, 't-m2', t, d);
  duel('H', M1, d, 'N', M1D, t, 0.1, d + 0.25); duel('Y', M2, d, 'SS', M2D, t, 0.1, d + 0.25);
};

// ===== Scène 1 · Titre =====
S.montreHabillage(tl, 0.5);
S.entre(tl, def, T('t1') - 0.4, 0.05);
S.halo(tl, 'FS', A('t2', 0.45), 1.6); S.montre(tl, 'e-1s', A('t2', 0.5), 0.25); S.cache(tl, 'e-1s', F('t2') + 0.6, 0.3);

// ===== Scène 2 · Carte d'identité =====
S.etapeChapitre(tl, 0, T('c1') - 0.3);
liens(true, A('c1', 0.3));
bloc('bloc-rappel', A('c2', 0.1));
S.montre(tl, 'z-aide', A('c3', 0.4), 0.3); S.halo(tl, 'FS', A('c3', 0.4), 0);
S.montre(tl, 'cad', T('c4') + 0.1, 0.25); S.montre(tl, 'e-ferme', A('c4', 0.5), 0.25);
S.couleur(tl, 'R', A('c5', 0.3), C.jaune); S.montre(tl, 'z-rob', A('c5', 0.3), 0.3);
S.montre(tl, 'e-rob', A('c6', 0.4), 0.25);

// ===== Scène 3 · La reconnaître =====
let t = T('r1') - 0.4;
S.etapeChapitre(tl, 1, t); bloc(null, t); liens(false, t); cache(['cad', 'e-ferme', 'z-rob', 'e-rob', 'z-aide'], t); S.couleur(tl, 'R', t);
S.montre(tl, 'l-10', A('r1', 0.25), 0.3); bloc('bloc-un', A('r1', 0.3)); S.montre(tl, 'e-12', A('r1', 0.7), 0.25);
// Les corners : collés, à l'intérieur, les yeux sur les receveurs.
t = T('r2') - 0.2;
cache(['l-10', 'e-12'], t); haloEteint('FS', t); marges(false, t); S.camera(tl, t, 0.85, ZOOM_CB);
S.montre(tl, 'e-colle', A('r2', 0.2), 0.2); S.montre(tl, 'e-int', A('r2', 0.55), 0.2); S.montre(tl, 'l-regard', A('r2', 0.8), 0.2);
// Le motion : un défenseur traverse.
t = T('r3') - 0.35;
cache(['e-colle', 'e-int', 'l-regard'], t, 0.2); S.cameraLarge(tl, t, 0.8); marges(true, t + 0.5);
t = A('r3', 0.18);
S.montre(tl, 'ln-H', t, 0.25, 0.9);
S.va(tl, 'H', 33, -2.7, t, 1.8, 'power1.inOut'); S.va(tl, 'N', 33.6, 3.4, t, 1.8, 'power1.inOut');
S.bout(tl, 'ln-H', 1, 33, -2.7, t, 1.8, 'power1.inOut'); S.bout(tl, 'ln-H', 2, 33.6, 3.4, t, 1.8, 'power1.inOut');
S.montre(tl, 'e-ind', T('r4'), 0.3);
// Au snap : il te suit, le safety reste.
t = T('r5') - 0.5;
S.etapeChapitre(tl, 2, t); cache(['e-ind', 'ln-H'], t, 0.2); bloc(null, t); remet(t + 0.02, 0.45);
t = A('r5', 0.4);
liens(true, t - 0.1);
[['X', [[5.8, -0.8], [5.8, 7]], 'CBG', [[6.6, 1.6], [6.5, 8.2]]], ['H', [[14, -1.9], [14, 5.5]], 'N', [[14.8, 1.8], [14.9, 6.8]]],
  ['Y', [[39.3, -1.9], [39.3, 5.5]], 'SS', [[38.5, 2], [38.4, 6.8]]], ['Z', [[47.5, -0.8], [47.5, 7]], 'CBD', [[46.7, 1.6], [46.8, 8.2]]]].forEach(([r, p, d, pd]) => duel(r, p, 1.5, d, pd, t));
S.va(tl, 'QB', 26.667, -6.8, t, 0.9, 'power1.out');
S.halo(tl, 'FS', A('r5', 0.75), 0); S.montre(tl, 'z-aide', A('r5', 0.75), 0.3);

// ===== Scène 4 · Ses faiblesses =====
t = T('f0') - 0.5;
S.etapeChapitre(tl, 3, t); liens(false, t); remet(t + 0.05);
// Un : les duels extérieurs sont loin de lui.
t = A('f1', 0.25);
['no1g', 'no1d', 'd-g', 'd-d'].forEach((id) => S.montre(tl, id, t, 0.25)); S.montre(tl, 'e-20g', t + 0.3, 0.2); S.montre(tl, 'e-20d', t + 0.3, 0.2);
// Deux : vers la touche, personne ne vient aider.
t = T('f2') - 0.2;
cache(['d-g', 'd-d', 'e-20g', 'e-20d', 'no1g', 'no1d'], t, 0.2); S.montre(tl, 'no2', A('f2', 0.1), 0.25);
t = A('f2', 0.3);
S.montre(tl, 'ln-Z', t - 0.1, 0.2, 0.9); S.dessine(tl, 't-out', t, 1.5); duel('Z', OUT_Z, 1.5, 'CBD', OUT_CB, t);
S.lance(tl, [26.667, -5], [52, 10.6], t + 0.9, 0.65); S.halo(tl, 'Z', t + 1.55, 0);
// Trois : sur un croisement, il court derrière.
t = T('f3') - 0.5;
cache(['ballon', 'no2', 'ln-Z', 'z-aide'], t, 0.2); haloEteint('Z', t, C.orange); haloEteint('FS', t); S.efface(tl, 't-out', t, 0.2); remet(t + 0.02, 0.42);
S.montre(tl, 'no3', A('f3', 0.1), 0.25);
t = A('f3', 0.4);
S.montre(tl, 'ln-H', t - 0.1, 0.2, 0.9); S.dessine(tl, 't-x3', t, 2.0);
duel('H', [[14, -1.9], [16, 3], [42, 3.2]], 2.0, 'N', [[14.8, 1.8], [16.6, 4.4], [38.4, 4.3]], t, 0.12, 2.15);

// ===== Scène 5 · La battre, côté quarterback =====
t = T('q1') - 0.55;
S.etapeChapitre(tl, 4, t); cache(['no3', 'ln-H'], t, 0.2); S.efface(tl, 't-x3', t, 0.2); remet(t + 0.05);
// Deux joueurs à situer : le safety et le robber.
S.halo(tl, 'FS', A('q1', 0.72), 0); S.montre(tl, 'z-aide', A('q1', 0.72), 0.3);
S.couleur(tl, 'R', A('q1', 0.9), C.jaune); S.montre(tl, 'z-rob', A('q1', 0.9), 0.3); S.montre(tl, 'e-rob', A('q1', 0.92), 0.25);
MAN.forEach((id) => tl.to('#' + id, { opacity: 0.38, duration: 0.3 }, T('q2'))); liens(true, A('q2', 0.4));
S.montre(tl, 'e-regle', A('q3', 0.08), 0.3); bloc('bloc-regle', A('q3', 0.1));

// ===== Scène 6 · Première arme : le duel extérieur =====
t = T('d1') - 0.5;
S.etapeChapitre(tl, 5, t); cache(['e-regle', 'z-rob', 'e-rob'], t, 0.2); liens(false, t); S.couleur(tl, 'R', t);
MAN.forEach((id) => tl.to('#' + id, { opacity: 1, duration: 0.3 }, t));
S.halo(tl, 'X', A('d1', 0.55), 1.6); S.halo(tl, 'Z', A('d1', 0.65), 0);
// Vendre la verticale, casser à l'opposé du levier.
t = A('d2', 0.3);
S.montre(tl, 'ln-Z', t - 0.1, 0.2, 0.9); S.dessine(tl, 't-out', t, 1.9); duel('Z', OUT_Z, 1.9, 'CBD', OUT_CB, t, 0.06, 2.0);
S.montre(tl, 'e-out', A('d3', 0.6), 0.2); S.lance(tl, [26.667, -5], [52, 10.6], A('d3', 0.2), 0.65);
S.dessine(tl, 't-cb', A('d3', 0.82), 0.7); S.montre(tl, 'e-cb', A('d3', 0.9), 0.2);
// La fade : garder sa largeur.
t = T('d4') - 0.5;
cache(['ballon', 'e-out', 'e-cb', 'ln-Z'], t, 0.2); haloEteint('Z', t, C.orange); S.efface(tl, 't-out', t, 0.2); S.efface(tl, 't-cb', t, 0.2); remet(t + 0.02, 0.42);
S.montre(tl, 'couloir', A('d4', 0.2), 0.3); S.montre(tl, 'e-largeur', A('d4', 0.25), 0.25);
S.dessine(tl, 't-fade', A('d4', 0.2), 1.4);
t = A('d4', 0.62);
S.dessine(tl, 't-derive', t, 1.1); S.va(tl, 'FS', 19.5, 15.5, t + 0.3, 1.0, 'power1.inOut'); S.montre(tl, 'm-derive', t + 1.15, 0.15);

// ===== Scène 7 · Deuxième arme : le mesh =====
t = T('m1') - 0.55;
S.etapeChapitre(tl, 6, t); bloc(null, t); cache(['couloir', 'e-largeur', 'm-derive', 'z-aide'], t, 0.2); haloEteint('FS', t);
S.efface(tl, 't-fade', t, 0.2); S.efface(tl, 't-derive', t, 0.2); remet(t + 0.05);
t = A('m2', 0.25);
S.montre(tl, 'ln-H', t - 0.1, 0.2, 0.9); S.montre(tl, 'ln-Y', t - 0.1, 0.2, 0.9);
mesh(t, 2.6);
// Le lancer : au croiseur qui a de l'avance, une fois le robber derrière lui.
t = T('m5') - 0.55;
S.efface(tl, 't-m1', t, 0.2); S.efface(tl, 't-m2', t, 0.2); remet(t + 0.02, 0.45);
S.couleur(tl, 'R', T('m5'), C.jaune); S.montre(tl, 'l-rob', T('m5') + 0.1, 0.25); S.montre(tl, 'e-rob', T('m5') + 0.1, 0.25); bloc('bloc-regle', T('m5'));
t = A('m5', 0.3);
mesh(t, 2.4);
S.lance(tl, [26.667, -5], [16.4, 5.05], t + 1.5, 0.65); S.halo(tl, 'Y', t + 2.15, 0);

// ===== Scène 8 · Ne pas confondre =====
t = T('n1') - 0.55;
S.etapeChapitre(tl, 7, t); bloc(null, t); cache(['ballon', 'l-rob', 'e-rob', 'ln-H', 'ln-Y'], t, 0.2); haloEteint('Y', t, C.orange); S.couleur(tl, 'R', t);
S.efface(tl, 't-m1', t, 0.2); S.efface(tl, 't-m2', t, 0.2); remet(t + 0.05);
S.halo(tl, 'FS', A('n2', 0.6), 1.5); S.montre(tl, 'e-meme', A('n2', 0.3), 0.3);
t = T('n3') - 0.2;
S.cache(tl, 'e-meme', t, 0.2); marges(false, t); S.camera(tl, t, 0.85, ZOOM_SNAP);
// Cover 1 : il reste attaché.
t = T('n4') + 0.2;
S.dessine(tl, 't-zv', t, 1.3); S.court(tl, 'Z', [[47.5, -0.8], [47.5, 11]], t, 1.35); S.va(tl, 'CBD', 46.7, 11.6, t + 0.08, 1.32, 'power1.in');
