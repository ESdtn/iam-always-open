S.cadenas('cad-f', 26.667, 18.9, true); E('e-tampa', 26.667, 21, 'TAMPA 2', { col: C.rouge, coulTexte: '#fff', taille: 30 });

const gribouillis = [
  rond(30, 20, 78, C.orange, 9), rond(1450, 82, 56, C.orange, 7), croix(1452, 84, 30, C.craie, 7, 0, .8), croix(1558, 92, 28, C.craie, 7, 4, .8), croix(1662, 96, 28, C.craie, 7, -5, .8),
  croix(1838, 124, 60, C.orange, 16, 4), hachures(8, 470, 13, 46, 48, C.orange, 9, true), rond(150, 990, 50, C.orange, 8), croix(96, 920, 34, C.craie, 8, -8, .85),

hote.insertAdjacentHTML('beforeend', `
  <div class="bloc-g ombre" id="bloc-compte" style="opacity:0"><div class="ligne" id="cp-p" style="opacity:0"><b style="color:var(--ciel)">2</b>profonds</div><div class="ligne" id="cp-d" style="opacity:0"><b style="color:var(--jaune)">5</b>dessous</div></div>

  <div class="bloc-g ombre" id="bloc-deux" style="opacity:0"><div class="ligne"><b>2</b>safeties</div></div>
  <div class="bloc-g ombre" id="bloc-regle" style="opacity:0"><div class="regle"><div id="rg-a">Il recule → <b>hitch</b></div><div id="rg-b">Il reste bas → <b>corner</b></div></div></div>
  <div class="bloc-g ombre" id="bloc-regle2" style="opacity:0"><div class="regle"><div id="rg-c">Il s'écarte → <b>seam</b></div><div id="rg-d">Il reste → <b>la touche</b></div></div></div>
  <div class="ardoise" id="ardoise" style="opacity:0">
    <svg width="1920" height="1080" viewBox="0 0 1920 1080">${defs()}${fond()}<g data-layout-allow-overflow>${gribouillis}</g></svg>
    <div class="coin" style="position:absolute;top:34px;left:160px;display:flex;align-items:center;gap:20px"><span class="titre" style="font-size:46px">COVER 2</span><span class="pastille zone">Zone</span><span class="pastille">2 safeties</span></div>
    <div class="titre-ardoise"><span class="script">Le réflexe</span></div>
    <div class="cartes">
      <div class="carte" id="rx-qb" style="opacity:0"><div class="onglet">QB</div><div class="quand">2 safeties, un corner court</div><div class="quoi">Je lis <b>le&nbsp;corner.</b></div></div>
      <div class="carte" id="rx-wr" style="opacity:0"><div class="onglet">WR</div><div class="quand">Je garde ma largeur</div><div class="quoi">J'attaque le trou <b>le long de la&nbsp;touche</b>, ou <b>le&nbsp;milieu.</b></div></div>
    </div>
  </div>`);
creerSousTitres(hote, tl, M);

// --- Aides propres à cette vidéo ---
const BLOCS = ['bloc-compte', 'bloc-rappel', 'bloc-deux', 'bloc-regle', 'bloc-regle2'];
const bloc = (id, t) => BLOCS.forEach((b) => tl.to('#' + b, { opacity: b === id ? 1 : 0, duration: 0.25 }, t));
const regle = (ids, n, t) => ids.forEach((id, i) => {
  tl.to('#' + id, { backgroundColor: i === n ? C.orange : 'rgba(14,18,15,.78)', color: i === n ? C.ardoise : '#fff', duration: 0.2 }, t);
  tl.to(`#${id} b`, { color: i === n ? C.ardoise : C.orange, duration: 0.2 }, t);
});
const zones = (ids, actif, t) => ids.forEach((id, i) => (actif ? S.montre(tl, id, t + i * 0.05, 0.3) : S.cache(tl, id, t, 0.25)));

const remet = (t, d = 0.45) => { S.formation(tl, S.ATTAQUE, t, d); S.formation(tl, DEF2, t, d); };
// Pendant un zoom, on ne garde que le titre et les pastilles.
const marges = (actif, t) => ['#ui-d', '#legende', '#ui-g .etape'].forEach((q) => tl.to(q, { opacity: actif ? 1 : 0, duration: 0.25 }, t));
// Le smash côté gauche : hitch de X, corner de H.
const smash = (t) => {
  S.dessine(tl, 't-hitch', t, 0.7); S.court(tl, 'X', [[5.8, -0.8], [5.8, 4.3]], t, 0.75);
  S.dessine(tl, 't-corner', t, 2.0); S.court(tl, 'H', [[14, -1.9], [14, 11], [5.4, 17.6]], t, 2.05);
  S.formation(tl, { N: [15.5, 6.6], M: [26.667, 6.8], LB: [37.8, 6.6], SS: [38.8, 17.4], CBD: [48.1, 5.6] }, t, 1.4);
};
const finSmash = (t) => { cache(['ballon'], t, 0.15); ['X', 'H'].forEach((id) => haloEteint(id, t, C.orange)); S.efface(tl, 't-hitch', t, 0.2); S.efface(tl, 't-corner', t, 0.2); };
// Seam du slot et vertical extérieur, côté droit.
const verticaux = (t) => {
  S.dessine(tl, 't-seam', t, 2.0); S.court(tl, 'Y', [[39.3, -1.9], [36, 6], [30.2, 19]], t, 2.05);
  S.dessine(tl, 't-fade', t, 2.0); S.court(tl, 'Z', [[47.5, -0.8], [49.9, 5], [49.6, 19]], t, 2.05);
  S.formation(tl, { CBG: [5.2, 5.6], CBD: [48.1, 5.6], N: [15.5, 6.6], M: [26.667, 6.8], LB: [37.8, 6.6], FS: [14.5, 17.4] }, t, 1.4);
};
const finVerticaux = (t) => { cache(['ballon'], t, 0.15); ['Y', 'Z'].forEach((id) => haloEteint(id, t, C.orange)); S.efface(tl, 't-seam', t, 0.2); S.efface(tl, 't-fade', t, 0.2); };

// ===== Scène 1 · Titre =====
S.montreHabillage(tl, 0.5);
S.entre(tl, def, T('t1') - 0.4, 0.05);
['FS', 'SS'].forEach((id) => S.halo(tl, id, T('t2') + 0.1, 1.8));
S.montre(tl, 'cad-o', A('t2', 0.5), 0.25); S.montre(tl, 'e-ouvert', A('t2', 0.6), 0.25);

// ===== Scène 2 · Carte d'identité =====
let t = T('c1') - 0.3;
S.etapeChapitre(tl, 0, t);
zones(ZP, true, A('c1', 0.2)); bloc('bloc-compte', A('c1', 0.2)); S.montre(tl, 'cp-p', A('c1', 0.25), 0.25);
zones(ZC, true, A('c2', 0.3)); S.montre(tl, 'cp-d', A('c2', 0.35), 0.25);
['CBG', 'CBD'].forEach((id) => S.halo(tl, id, T('c3') + 0.1, 2.2)); S.montre(tl, 'e-flats', A('c3', 0.5), 0.25);
S.cache(tl, 'e-flats', T('c4') - 0.1, 0.2); bloc('bloc-rappel', A('c4', 0.1));

// ===== Scène 3 · La reconnaître =====
t = T('r1') - 0.4;
S.etapeChapitre(tl, 1, t); bloc(null, t); zones([...ZC, ...ZP], false, t); cache(['cad-o', 'e-ouvert'], t);
S.montre(tl, 'l-10', A('r1', 0.2), 0.3); bloc('bloc-deux', A('r1', 0.25)); ['FS', 'SS'].forEach((id) => S.halo(tl, id, A('r1', 0.25), 2.6));
S.montre(tl, 'e-12', A('r1', 0.5), 0.25);
// Les corners : cinq yards, à l'extérieur, les yeux sur le quarterback.
t = T('r2') - 0.2;
cache(['l-10', 'e-12'], t); marges(false, t); bloc(null, t); S.camera(tl, t, 0.85, { zoom: 2.0, cx: 44, cy: 5, sx: 1150, sy: 425 });
['N', 'M', 'LB', 'FS', 'SS'].forEach((id) => tl.to('#' + id, { opacity: 0, duration: 0.25 }, t));
S.montre(tl, 'e-5', A('r2', 0.3), 0.2); S.montre(tl, 'e-ext', A('r2', 0.55), 0.2); S.montre(tl, 'l-regard', A('r2', 0.8), 0.25);
// Au snap : il gêne le départ, puis il reste court.
t = T('r3') - 0.4;
S.etapeChapitre(tl, 2, t); cache(['e-5', 'e-ext', 'l-regard'], t, 0.2);
t = A('r3', 0.3);
S.va(tl, 'CBD', 48.2, 1.9, t, 0.45, 'power1.out'); S.va(tl, 'Z', 46.9, 1.4, t, 0.5, 'power1.out'); S.montre(tl, 'e-jam', t + 0.4, 0.2);
S.va(tl, 'Z', 46.8, 9, t + 0.6, 1.2, 'power1.in'); S.va(tl, 'CBD', 48.1, 5.6, t + 0.7, 0.9); S.halo(tl, 'CBD', A('r3', 0.8), 2.2);
// Les safeties reculent en s'écartant.

S.cache(tl, 'e-jam', t, 0.2); S.cameraLarge(tl, t, 0.8); marges(true, t + 0.5);
['N', 'M', 'LB', 'FS', 'SS'].forEach((id) => tl.to('#' + id, { opacity: 1, duration: 0.25 }, t + 0.3));
t = T('r4') + 0.3;
S.formation(tl, { ...ZONE2, CBD: [48.1, 5.6] }, t, 1.5);
[['X', 5.8, 8], ['H', 14, 6], ['Y', 39.3, 6]].forEach(([id, x, y]) => S.va(tl, id, x, y, t, 1.5, 'power1.out'));
['FS', 'SS'].forEach((id) => S.halo(tl, id, t + 0.3, 1.8)); zones(ZP, true, t + 0.8);

// ===== Scène 4 · Ses faiblesses =====
t = T('f0') - 0.5;
S.etapeChapitre(tl, 3, t); remet(t + 0.05); S.formation(tl, ZONE2, T('f0'), 0.6); zones(ZC, true, T('f0') + 0.2);
// Un : le long de la touche, entre le corner et le safety.
t = A('f1', 0.12);
['tr-g', 'tr-d', 'no1g', 'no1d'].forEach((id) => S.montre(tl, id, t, 0.25)); S.montre(tl, 'd-g', A('f1', 0.55), 0.25); S.montre(tl, 'd-d', A('f1', 0.55), 0.25);
// Deux : le milieu profond.
S.montre(tl, 'tr-m', A('f2', 0.3), 0.25); S.montre(tl, 'no2', A('f2', 0.3), 0.25);
// Trois : l'intermédiaire, derrière les linebackers.
S.montre(tl, 'tr-i', A('f3', 0.3), 0.25); S.montre(tl, 'no3', A('f3', 0.3), 0.25);

// ===== Scène 5 · Le défenseur en conflit : le smash =====
t = T('k1') - 0.55;
S.etapeChapitre(tl, 4, t); cache(['tr-g', 'tr-d', 'tr-m', 'tr-i', 'no1g', 'no1d', 'no2', 'no3', 'd-g', 'd-d'], t, 0.2); zones([...ZC, ...ZP], false, t); remet(t + 0.05);
S.conflit(tl, 'CBG', A('k1', 0.5)); S.montre(tl, 'e-conflit', A('k1', 0.6), 0.25);
S.dessine(tl, 't-hitch', A('k2', 0.5), 0.6); S.dessine(tl, 't-corner', A('k2', 0.75), 0.9); S.montre(tl, 'e-smash', A('k2', 0.3), 0.3);
S.montre(tl, 'cone', A('k3', 0.4), 0.3); bloc('bloc-regle', A('k3', 0.4));
// Il recule sous le tracé profond : le hitch.
t = T('k4') - 0.3;
S.efface(tl, 't-hitch', t, 0.15); S.efface(tl, 't-corner', t, 0.15); S.cache(tl, 'e-smash', t, 0.2); regle(['rg-a', 'rg-b'], 0, T('k4'));
t = T('k4') + 0.05;
smash(t); S.va(tl, 'CBG', 4.9, 10.6, t + 0.2, 1.0, 'power1.out'); S.va(tl, 'FS', 13, 17.4, t, 1.4);
S.lance(tl, [26.667, -5], [5.8, 4.1], t + 0.75, 0.6); S.halo(tl, 'X', t + 1.35, 0);
// Il reste bas sur le hitch : le corner, dans le trou.
t = T('k5') - 0.5;
finSmash(t); remet(t + 0.02, 0.42); regle(['rg-a', 'rg-b'], 1, T('k5'));
t = T('k5') + 0.05;
smash(t); S.va(tl, 'CBG', 5.5, 5.8, t + 0.2, 0.6, 'power1.out'); S.va(tl, 'FS', 12.5, 17.8, t, 1.9, 'power1.in');
S.montre(tl, 'tr-g', t + 1.2, 0.25); S.lance(tl, [26.667, -5], [5.4, 17.4], t + 1.2, 0.85); S.halo(tl, 'H', t + 2.05, 0);

// ===== Scène 6 · Le smash, côté receveurs =====
t = T('w1') - 0.55;
S.etapeChapitre(tl, 5, t); finSmash(t); cache(['cone', 'e-conflit', 'tr-g'], t, 0.2); bloc(null, t); S.conflit(tl, 'CBG', t, false); remet(t + 0.05);
// Garder sa largeur : le corner veut pousser vers l'intérieur.
S.montre(tl, 'couloir', A('w1', 0.55), 0.3); S.montre(tl, 'e-largeur', A('w1', 0.6), 0.25); S.montre(tl, 'tr-g', A('w1', 0.6), 0.25);
t = A('w2', 0.15);
S.va(tl, 'CBG', 5.4, 2, t, 0.5, 'power1.out'); S.halo(tl, 'CBG', t + 0.3, 2.4);
S.dessine(tl, 't-derive', A('w3', 0.1), 1.2); S.montre(tl, 'm-derive', A('w3', 0.1) + 1.25, 0.15); tl.to('#tr-g circle', { stroke: C.rouge, fill: C.rouge, duration: 0.3 }, A('w3', 0.1) + 1.2);
// Le slot : casser vers la touche, loin du safety.
t = T('w4') - 0.5;
cache(['couloir', 'e-largeur', 'm-derive'], t, 0.2); S.efface(tl, 't-derive', t, 0.2); tl.to('#tr-g circle', { stroke: C.orange, fill: C.orange, duration: 0.2 }, t); remet(t + 0.02, 0.42);
t = A('w4', 0.12);
S.dessine(tl, 't-corner', t, 2.0); S.court(tl, 'H', [[14, -1.9], [14, 11], [5.4, 17.6]], t, 2.05);
S.formation(tl, { ...ZONE2, FS: [13.6, 17.4] }, t, 1.6); S.halo(tl, 'FS', t + 0.9, 0); S.montre(tl, 'e-loin', t + 1.5, 0.25);

// ===== Scène 7 · Deuxième attaque : le milieu profond =====

S.etapeChapitre(tl, 6, t); cache(['tr-g', 'e-loin'], t, 0.2); haloEteint('FS', t); S.efface(tl, 't-corner', t, 0.2); remet(t + 0.05);
S.montre(tl, 'tr-m', A('m1', 0.6), 0.25);
